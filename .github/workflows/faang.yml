name: FAANG Automation Workflow
run-name: ${{ github.actor }} triggered FAANG automation 🚀

on:
  schedule:
    - cron: "0 9 * * 6"   # Every Saturday at 09:00 UTC
  workflow_dispatch:       # Allow manual runs for testing

permissions:
  contents: write          # Needed to push changes back to the repo

jobs:
  Run-FAANG-Analysis:
    runs-on: ubuntu-latest

    steps:
      - run: echo "🎉 Workflow triggered by ${{ github.event_name }} event."
      - run: echo "🐧 Running on a ${{ runner.os }} server hosted by GitHub."
      - run: |
          echo "🔎 Branch: ${{ github.ref }} | Repository: ${{ github.repository }}"

      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FAANG script
        run: |
          chmod +x faang.py
          ./faang.py

      - name: List generated files
        run: |
          ls -lh data || echo "No data directory yet"
          ls -lh plots || echo "No plots directory yet"

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv plots/*.png || echo "No new files to add"
          git commit -m "Automated FAANG results on $(date -u +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
