name: FAANG Automation Workflow
run-name: ${{ github.actor }} triggered FAANG automation 🚀

# -------------------------------------------------------------------
# FAANG Automation Workflow
# Updated: December 2025
# Notes:
# - Runs every Saturday at 09:00 UTC
# - Includes diagnostic steps for SSL/network checks
# - Designed for reproducibility and reviewer clarity
# -------------------------------------------------------------------

on:
  schedule:
    - cron: "0 9 * * 6"   # Every Saturday at 09:00 UTC
  workflow_dispatch:       # Allow manual runs for testing

permissions:
  contents: write          # Needed to push changes back to the repo

jobs:
  Run-FAANG-Analysis:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg   # Ensure headless plotting works (no display required)
      BRANCH_NAME: ${{ github.ref_name }}
      WORKFLOW_VERSION: "2025-12-03"   # Extra metadata for tracking

    steps:
      - run: echo "🎉 Workflow triggered by ${{ github.event_name }} event."
      - run: echo "🐧 Running on a ${{ runner.os }} server hosted by GitHub."
      - run: |
          echo "🔎 Branch: ${{ github.ref }} | Repository: ${{ github.repository }}"
          echo "📌 Workflow version: $WORKFLOW_VERSION"

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # Use the ref that triggered the workflow
          fetch-depth: 0           # Full history so we can commit and push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure certifi is up to date for SSL
          python -m pip install --upgrade certifi

      # 🔎 Diagnostic step to confirm environment and API connectivity
      - name: Debug environment and network
        run: |
          python --version
          pip list
          curl -I https://query1.finance.yahoo.com/v7/finance/download/AAPL || echo "Yahoo Finance unreachable"

      - name: Run FAANG script
        run: |
          echo "🚀 Starting FAANG analysis run..."
          python faang.py
          echo "✅ FAANG script finished."

      - name: List generated files
        run: |
          ls -lh data || echo "No data directory yet"
          ls -lh plots || echo "No plots directory yet"

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$PWD"
          # Stage generated artifacts if present
          if ls data/*.csv >/dev/null 2>&1; then git add data/*.csv; fi
          if ls plots/*.png >/dev/null 2>&1; then git add plots/*.png; fi
          # Commit if there are staged changes
          git diff --cached --quiet && echo "ℹ️ No changes to commit" || git commit -m "Automated FAANG results on $(date -u +'%Y-%m-%d %H:%M:%S')"
          # Push to the branch that triggered the workflow (e.g. main)
          git push origin "$BRANCH_NAME"
