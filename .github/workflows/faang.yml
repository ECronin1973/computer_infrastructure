name: FAANG Automation Workflow
run-name: ${{ github.actor }} triggered FAANG automation 🚀

on:
  push:                     # Run immediately when you push changes
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  Run-FAANG-Analysis:
    runs-on: ubuntu-latest

    steps:
      - run: echo "🎉 Workflow triggered by ${{ github.event_name }} event."
      - run: echo "🐧 Running on a ${{ runner.os }} server hosted by GitHub."
      - run: echo "🔎 Branch: ${{ github.ref }} | Repository: ${{ github.repository }}"

      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FAANG script
        run: ./faang.py

      - name: List generated files
        run: |
          ls -lh data
          ls -lh plots

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/*.csv plots/*.png
          git commit -m "Automated FAANG update — $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push

      - run: echo "🍏 Job completed with status ${{ job.status }}."
