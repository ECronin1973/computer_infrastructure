name: FAANG Automation Workflow
run-name: ${{ github.actor }} triggered FAANG automation 🚀

# -------------------------------------------------------------------
# FAANG Automation Workflow
# Updated: December 2025
# Notes:
# - Runs every Saturday at 09:00 UTC
# - Includes diagnostic steps for SSL/network checks
# - Designed for reproducibility and reviewer clarity
# -------------------------------------------------------------------

on:
  schedule:
    - cron: "0 9 * * 6"   # Every Saturday at 09:00 UTC
  workflow_dispatch:       # Allow manual runs for testing

permissions:
  contents: write          # Needed to push changes back to the repo

jobs:
  Run-FAANG-Analysis:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg   # Ensure headless plotting works
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FAANG script
        run: |
          set -e  # stop immediately if python faang.py exits with non‑zero
          python faang.py
          echo "✅ FAANG script executed successfully at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: List generated files
        run: |
          ls -lh data || echo "No data directory yet"
          ls -lh plots || echo "No plots directory yet"

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$PWD"
          # Stage generated artifacts if present
          git add data/*.csv plots/*.png || echo "No files to add"
          # Commit if there are staged changes
          git diff --cached --quiet && echo "ℹ️ No changes to commit" || git commit -m "Automated FAANG results on $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          # Push to the branch that triggered the workflow (e.g. main)
          git push origin "$BRANCH_NAME"
