name: FAANG Automation Workflow
run-name: ${{ github.actor }} triggered FAANG automation 🚀

on: [push]   # Run immediately on push to any branch

jobs:
  Run-FAANG-Analysis:
    runs-on: ubuntu-latest

    steps:
      - run: echo "🎉 Workflow triggered by ${{ github.event_name }} event."
      - run: echo "🐧 Running on a ${{ runner.os }} server hosted by GitHub."
      - run: |
          echo "🔎 Branch: ${{ github.ref }} | Repository: ${{ github.repository }}"

      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FAANG script
        run: |
          chmod +x faang.py
          ./faang.py

      - name: List generated files
        run: |
          ls -lh data || echo "No data directory yet"
          ls -lh plots || echo "No plots directory yet"
